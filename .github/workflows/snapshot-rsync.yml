name: Reusable live-server snapshot

on:
  workflow_call:
    inputs:
      deploy_host:
        description: SSH host
        required: true
        type: string
      deploy_port:
        description: SSH port
        required: false
        default: "22"
        type: string
      deploy_user:
        description: SSH user
        required: true
        type: string
      deploy_path:
        description: Live server directory to snapshot
        required: true
        type: string
      source_path:
        description: Repository directory where the snapshot is stored
        required: true
        type: string
    secrets:
      ssh_private_key:
        required: true
      ssh_known_hosts:
        required: true

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.repository }}-${{ inputs.deploy_path }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot live server
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ inputs.deploy_host }}
      DEPLOY_PORT: ${{ inputs.deploy_port }}
      DEPLOY_USER: ${{ inputs.deploy_user }}
      DEPLOY_PATH: ${{ inputs.deploy_path }}
      SOURCE_PATH: ${{ inputs.source_path }}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "ssh_private_key is not configured" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "ssh_known_hosts is not configured" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Save live server code to snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          snapshot_root="$(mktemp -d)"
          server_snapshot="$snapshot_root/server"
          snapshot_worktree="$snapshot_root/repository"
          mkdir -p "$server_snapshot/$SOURCE_PATH"

          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --rsh="ssh -p $DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/" \
            "$server_snapshot/$SOURCE_PATH/"

          git worktree add --detach "$snapshot_worktree" "$GITHUB_SHA"
          rsync --archive --delete \
            --exclude='.env' \
            "$server_snapshot/$SOURCE_PATH/" \
            "$snapshot_worktree/$SOURCE_PATH/"
          rm -f "$snapshot_worktree/$SOURCE_PATH/.env"

          git -C "$snapshot_worktree" config user.name "github-actions[bot]"
          git -C "$snapshot_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$snapshot_worktree" add -A -- "$SOURCE_PATH"
          git -C "$snapshot_worktree" commit --allow-empty \
            -m "Snapshot live server before manual changes"
          git -C "$snapshot_worktree" push --force origin \
            "HEAD:refs/heads/snapshot"

          git worktree remove --force "$snapshot_worktree"
