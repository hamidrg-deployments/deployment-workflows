name: Reusable multi-directory deployment of a selected branch or commit

on:
  workflow_call:
    inputs:
      deploy_ref:
        description: Branch, tag, or full commit SHA in the calling repository to deploy
        required: true
        type: string
      deployments_json:
        description: JSON array of source_path, deploy_path, deploy_host, deploy_port, and deploy_user mappings
        required: true
        type: string
    secrets:
      ssh_private_key:
        required: true
      ssh_known_hosts:
        required: true

    outputs:
      deployed_sha:
        description: Resolved commit SHA deployed to the server
        value: ${{ jobs.deploy.outputs.deployed_sha }}

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.repository }}-multiple
  cancel-in-progress: false

jobs:
  deploy:
    name: Snapshot and deploy directories
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.revision.outputs.sha }}

    env:
      DEPLOYMENTS_JSON: ${{ inputs.deployments_json }}

    steps:
      - name: Validate selected ref
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_REF" || { echo "deploy_ref must not be empty" >&2; exit 1; }

      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0

      - name: Resolve deployment commit and validate all sources
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0' <<<"$DEPLOYMENTS_JSON" >/dev/null
          while IFS= read -r deployment; do
            source_path="$(jq -er '.source_path' <<<"$deployment")"
            [[ "$source_path" != /* ]] || { echo "source_path must be relative to the repository" >&2; exit 1; }
            test -d "$source_path" || { echo "$source_path does not exist" >&2; exit 1; }
            source_root="$(realpath -e -- "$source_path")"
            [[ "$source_root" == "$(pwd -P)/"* ]] || { echo "source_path must be a repository subdirectory" >&2; exit 1; }
            if git ls-files --stage -- "$source_path" | awk '$1 == "160000" {found=1} END {exit !found}'; then
              echo "Deploy submodule repositories directly; source_path contains a git submodule" >&2
              exit 1
            fi
          done < <(jq -c '.[]' <<<"$DEPLOYMENTS_JSON")
          deploy_sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$deploy_sha" >> "$GITHUB_OUTPUT"
          printf 'Deploying commit %s\n' "$deploy_sha"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "ssh_private_key is not configured" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "ssh_known_hosts is not configured" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Snapshot all live directories before deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0' <<<"$DEPLOYMENTS_JSON" >/dev/null

          snapshot_root="$(mktemp -d)"
          server_snapshot="$snapshot_root/server"
          snapshot_worktree="$snapshot_root/repository"
          mkdir -p "$server_snapshot"
          source_paths=()

          while IFS= read -r deployment; do
            source_path="$(jq -er '.source_path' <<<"$deployment")"
            deploy_path="$(jq -er '.deploy_path' <<<"$deployment")"
            deploy_host="$(jq -er '.deploy_host' <<<"$deployment")"
            deploy_port="$(jq -er '.deploy_port // "22"' <<<"$deployment")"
            deploy_user="$(jq -er '.deploy_user' <<<"$deployment")"

            test -d "$source_path" || { echo "$source_path does not exist" >&2; exit 1; }
            mkdir -p "$server_snapshot/$source_path"
            rsync --archive --compress --delete \
              --exclude='.git/' \
              --exclude='.env' \
              --rsh="ssh -p $deploy_port" \
              "$deploy_user@$deploy_host:$deploy_path/" \
              "$server_snapshot/$source_path/"
            source_paths+=("$source_path")
          done < <(jq -c '.[]' <<<"$DEPLOYMENTS_JSON")

          git worktree add --detach "$snapshot_worktree" "$DEPLOY_SHA"
          for source_path in "${source_paths[@]}"; do
            rsync --archive --delete \
              --exclude='.env' \
              "$server_snapshot/$source_path/" \
              "$snapshot_worktree/$source_path/"
            rm -f "$snapshot_worktree/$source_path/.env"
          done

          git -C "$snapshot_worktree" config user.name "github-actions[bot]"
          git -C "$snapshot_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$snapshot_worktree" add -A -- "${source_paths[@]}"
          git -C "$snapshot_worktree" commit --allow-empty \
            -m "Snapshot server before deploying ${DEPLOY_SHA}"
          git -C "$snapshot_worktree" push --force origin \
            "HEAD:refs/heads/snapshot"

          git worktree remove --force "$snapshot_worktree"

      - name: Sync all deployment directories
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r deployment; do
            source_path="$(jq -er '.source_path' <<<"$deployment")"
            deploy_path="$(jq -er '.deploy_path' <<<"$deployment")"
            deploy_host="$(jq -er '.deploy_host' <<<"$deployment")"
            deploy_port="$(jq -er '.deploy_port // "22"' <<<"$deployment")"
            deploy_user="$(jq -er '.deploy_user' <<<"$deployment")"

            rsync --archive --compress --itemize-changes \
              --exclude='.git/' \
              --exclude='.env' \
              --rsh="ssh -p $deploy_port" \
              "$source_path/" \
              "$deploy_user@$deploy_host:$deploy_path/"
          done < <(jq -c '.[]' <<<"$DEPLOYMENTS_JSON")

      - name: Summarize deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          printf 'Deployed commit: `%s`\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
