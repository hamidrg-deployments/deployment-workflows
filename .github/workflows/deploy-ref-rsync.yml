name: Reusable deployment of a selected branch or commit

on:
  workflow_call:
    inputs:
      deploy_ref:
        description: Branch, tag, or full commit SHA in the calling repository to deploy
        required: true
        type: string
      deploy_host:
        description: Fallback SSH host when DEPLOY_HOST is unset
        required: false
        type: string
      deploy_port:
        description: Fallback SSH port when DEPLOY_PORT is unset
        required: false
        default: "22"
        type: string
      deploy_user:
        description: Fallback SSH user when DEPLOY_USER is unset
        required: false
        type: string
      deploy_path:
        description: Destination directory on the server
        required: true
        type: string
      source_path:
        description: Repository directory to deploy and snapshot
        required: true
        type: string
      snapshot_branch:
        description: Branch that stores the live server snapshot
        required: false
        default: snapshot
        type: string
    secrets:
      ssh_private_key:
        required: true
      ssh_known_hosts:
        required: true
    outputs:
      deployed_sha:
        description: Resolved commit SHA deployed to the server
        value: ${{ jobs.deploy.outputs.deployed_sha }}

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.deploy_path }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Snapshot and deploy selected revision
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.revision.outputs.sha }}

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || inputs.deploy_host }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || inputs.deploy_port || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || inputs.deploy_user }}
      DEPLOY_PATH: ${{ inputs.deploy_path }}
      SOURCE_PATH: ${{ inputs.source_path }}
      SNAPSHOT_BRANCH: ${{ inputs.snapshot_branch }}

    steps:
      - name: Validate selected ref
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_REF" || { echo "deploy_ref must not be empty" >&2; exit 1; }

      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0

      - name: Resolve deployment commit and validate source
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_PATH" != /* ]] || { echo "source_path must be relative to the repository" >&2; exit 1; }
          test -d "$SOURCE_PATH" || { echo "$SOURCE_PATH does not exist" >&2; exit 1; }
          source_root="$(realpath -e -- "$SOURCE_PATH")"
          [[ "$source_root" == "$(pwd -P)/"* ]] || { echo "source_path must be a repository subdirectory" >&2; exit 1; }
          if git ls-files --stage -- "$SOURCE_PATH" | awk '$1 == "160000" {found=1} END {exit !found}'; then
            echo "Deploy submodule repositories directly; source_path contains a git submodule" >&2
            exit 1
          fi
          deploy_sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$deploy_sha" >> "$GITHUB_OUTPUT"
          printf 'Deploying commit %s\n' "$deploy_sha"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Set DEPLOY_HOST or provide deploy_host" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Set DEPLOY_USER or provide deploy_user" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "ssh_private_key is not configured" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "ssh_known_hosts is not configured" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Snapshot current server code before deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          snapshot_root="$(mktemp -d)"
          server_snapshot="$snapshot_root/server"
          snapshot_worktree="$snapshot_root/repository"
          mkdir -p "$server_snapshot/$SOURCE_PATH"

          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --rsh="ssh -p $DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/" \
            "$server_snapshot/$SOURCE_PATH/"

          git worktree add --detach "$snapshot_worktree" "$DEPLOY_SHA"
          rsync --archive --delete \
            --exclude='.env' \
            "$server_snapshot/$SOURCE_PATH/" \
            "$snapshot_worktree/$SOURCE_PATH/"
          rm -f "$snapshot_worktree/$SOURCE_PATH/.env"

          git -C "$snapshot_worktree" config user.name "github-actions[bot]"
          git -C "$snapshot_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$snapshot_worktree" add -A -- "$SOURCE_PATH"
          git -C "$snapshot_worktree" commit --allow-empty \
            -m "Snapshot server before deploying ${DEPLOY_SHA}"
          git -C "$snapshot_worktree" push --force origin \
            "HEAD:refs/heads/$SNAPSHOT_BRANCH"
          git worktree remove --force "$snapshot_worktree"

      - name: Sync deployment directory
        shell: bash
        run: |
          set -euo pipefail
          rsync --archive --compress --itemize-changes \
            --exclude='.git/' \
            --exclude='.env' \
            --rsh="ssh -p $DEPLOY_PORT" \
            "$SOURCE_PATH/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Summarize deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          printf 'Deployed commit: `%s`\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
