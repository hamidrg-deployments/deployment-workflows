name: Reusable revert to last snapshot

on:
  workflow_call:
    inputs:
      deploy_host:
        description: Fallback SSH host when DEPLOY_HOST is unset
        required: false
        type: string
      deploy_port:
        description: Fallback SSH port when DEPLOY_PORT is unset
        required: false
        default: "22"
        type: string
      deploy_user:
        description: Fallback SSH user when DEPLOY_USER is unset
        required: false
        type: string
      deploy_path:
        description: Fallback absolute server directory when DEPLOY_PATH is unset
        required: false
        type: string
      source_path:
        description: Repository directory to restore from snapshot
        required: true
        type: string
    secrets:
      ssh_private_key:
        required: false
      ssh_known_hosts:
        required: false
      SERVER_SSH_KEY:
        required: false
      SERVER_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

concurrency:
  group: revert-${{ github.repository }}-${{ vars.DEPLOY_PATH || inputs.deploy_path }}
  cancel-in-progress: false

jobs:
  revert:
    name: Restore last snapshot
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || inputs.deploy_host }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || inputs.deploy_port || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || inputs.deploy_user }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || inputs.deploy_path }}
      SOURCE_PATH: ${{ inputs.source_path }}

    steps:
      - name: Checkout last snapshot
        uses: actions/checkout@v6
        with:
          ref: snapshot
          fetch-depth: 0

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key || secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts || secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Set DEPLOY_HOST or provide deploy_host" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Set DEPLOY_USER or provide deploy_user" >&2; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != / ]] || { echo "Set DEPLOY_PATH or provide deploy_path as an absolute non-root directory" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "ssh_private_key is not configured" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "ssh_known_hosts is not configured" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Restore snapshot to server
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SOURCE_PATH" || { echo "Snapshot path $SOURCE_PATH does not exist" >&2; exit 1; }
          rsync --archive --compress --delete --itemize-changes \
            --exclude='.git/' \
            --exclude='.env' \
            --rsh="ssh -p $DEPLOY_PORT" \
            "$SOURCE_PATH/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
