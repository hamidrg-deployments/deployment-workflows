name: Deploy selected commit
run-name: Deploy ${{ inputs.deploy_ref }}
permissions:
  contents: write
jobs:
  deploy:
    uses: hamidrg-deployments/deployment-workflows/.github/workflows/deploy-ref-rsync.yml@v1.7.0
    with:
      deploy_ref: ${{ inputs.deploy_ref }}
      source_path: ${{ inputs.source_path }}
      deploy_host: ${{ inputs.deploy_host }}
      deploy_port: ${{ inputs.deploy_port }}
      deploy_user: ${{ inputs.deploy_user }}
      deploy_path: ${{ inputs.deploy_path }}
    secrets: inherit
'on':
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch, tag, or full commit SHA to deploy
        required: true
        type: string
      source_path:
        description: Repository subdirectory to deploy (submodules must be deployed from their own repositories)
        required: true
        type: string
      deploy_host:
        description: Fallback SSH host when DEPLOY_HOST is unset
        required: false
        type: string
      deploy_port:
        description: Fallback SSH port when DEPLOY_PORT is unset
        required: false
        type: string
        default: '22'
      deploy_user:
        description: Fallback SSH user when DEPLOY_USER is unset
        required: false
        type: string
      deploy_path:
        description: Absolute destination directory on the server
        required: true
        type: string
