name: Reusable multi-directory revert to last snapshot

on:
  workflow_call:
    inputs:
      deployments_json:
        description: JSON array of source_path, deploy_path, deploy_host, deploy_port, and deploy_user mappings
        required: true
        type: string
    secrets:
      ssh_private_key:
        required: true
      ssh_known_hosts:
        required: true

permissions:
  contents: read

concurrency:
  group: revert-${{ github.repository }}-multiple
  cancel-in-progress: false

jobs:
  revert:
    name: Restore module snapshots
    runs-on: ubuntu-latest

    env:
      DEPLOYMENTS_JSON: ${{ inputs.deployments_json }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}

    steps:
      - name: Checkout last snapshot
        uses: actions/checkout@v6
        with:
          ref: snapshot
          fetch-depth: 0

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "ssh_private_key is not configured" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "ssh_known_hosts is not configured" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Restore all module snapshots to server
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0' <<<"$DEPLOYMENTS_JSON" >/dev/null

          while IFS= read -r deployment; do
            source_path="$(jq -er '.source_path' <<<"$deployment")"
            deploy_path="$(jq -er '.deploy_path' <<<"$deployment")"
            deploy_host="${DEPLOY_HOST:-$(jq -er '.deploy_host' <<<"$deployment")}"
            deploy_port="${DEPLOY_PORT:-$(jq -er '.deploy_port // "22"' <<<"$deployment")}"
            deploy_user="${DEPLOY_USER:-$(jq -er '.deploy_user' <<<"$deployment")}"

            test -d "$source_path" || { echo "Snapshot path $source_path does not exist" >&2; exit 1; }
            rsync --archive --compress --delete --itemize-changes \
              --exclude='.git/' \
              --exclude='.env' \
              --rsh="ssh -p $deploy_port" \
              "$source_path/" \
              "$deploy_user@$deploy_host:$deploy_path/"
          done < <(jq -c '.[]' <<<"$DEPLOYMENTS_JSON")
